name: CI/CD Pipeline Armada Plus

on:
  push:
    branches:
      - dev2
      - main

jobs:
  build-check:
    name: Validar imagenes Docker
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar Docker Compose
        env:
          GROQ_API_KEY: "dummy_key_for_testing"
        run: |
          docker compose config

      - name: Probar compilacion del Backend
        run: |
          docker build ./Backend

      - name: Probar compilacion del Frontend
        run: |
          docker build ./Frontend


  deploy-production:
    name: Desplegar en Cloud Server
    needs: build-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y actualizar servicios
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /root/chatbox-armada
            git checkout main
            git pull origin main
            docker compose up -d --build
            docker image prune -f
